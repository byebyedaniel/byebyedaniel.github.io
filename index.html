<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mendoza Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FEFEFE;
  --ink:#141414;
  --soft:#5A5A5A;
  --hair:#DDDDDD;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'EB Garamond',Garamond,'Times New Roman',serif;
  font-size:19px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1000px;margin:0 auto;padding:0 48px}

/* ── CARD ───────────────────────────────────── */
.card{padding:64px 0 150px}
.corners{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.corners div:last-child{text-align:right}
.corners a{color:var(--ink);text-decoration:none}
.corners a:hover{text-decoration:underline}
.lg{font-size:1.5rem;line-height:1.35}
.sm{font-size:1.15rem;line-height:1.35;color:var(--soft)}

.centerpiece{text-align:center;padding:120px 0 0}
h1{
  font-weight:400;
  font-size:clamp(2.6rem,7.2vw,4.6rem);
  line-height:1.05;
}
h1 .caps{text-transform:uppercase}
.title{font-size:clamp(1.35rem,3vw,1.85rem);color:var(--ink);margin-top:14px}

.address{text-align:center;margin-top:150px;font-size:1.1rem}

/* ── NAV ────────────────────────────────────── */
nav{text-align:center;padding-bottom:110px}
nav a{
  color:var(--soft);text-decoration:none;font-size:1.05rem;
  margin:0 22px;
}
nav a:hover,nav a:focus-visible{color:var(--ink);text-decoration:underline}

/* ── SECTIONS ───────────────────────────────── */
section{padding-bottom:120px}
h2{
  font-weight:400;font-size:1.05rem;color:var(--soft);
  text-align:center;margin-bottom:64px;
}

/* ── JOURNAL ────────────────────────────────── */
.entry{
  max-width:640px;margin:0 auto 52px;text-align:center;
  cursor:pointer;
}
.entry:last-child{margin-bottom:0}
.entry-date{font-size:1rem;color:var(--soft)}
.entry-title{
  font-weight:400;font-size:1.85rem;line-height:1.25;margin-top:6px;
  display:inline-block;
}
.entry:hover .entry-title,.entry:focus-visible .entry-title{text-decoration:underline}
.entry:focus-visible{outline:none}
.entry-dek{color:var(--soft);margin-top:8px}
.entry-body{display:none;margin-top:28px;text-align:left}
.entry-body p{margin-bottom:16px}
.entry-body p:last-child{margin-bottom:0}
.entry.open .entry-body{display:block}

/* ── WORK ───────────────────────────────────── */
.piece{max-width:720px;margin:0 auto 46px;text-align:center;cursor:pointer}
.piece:last-child{margin-bottom:0}
.piece:focus-visible{outline:none}
.piece h3{font-weight:400;font-size:1.6rem;display:inline-block}
.piece:hover h3,.piece:focus-visible h3{text-decoration:underline}
.piece p{color:var(--soft);margin-top:6px}
.piece .watch{font-size:1rem;color:var(--soft);margin-top:10px;font-style:italic}
.player{display:none;margin-top:26px}
.piece.open .player{display:block}
.frame{position:relative;width:100%;padding-bottom:56.25%;height:0}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ── PAGINATION ─────────────────────────────── */
.pager{
  display:flex;justify-content:center;align-items:center;gap:20px;
  margin-top:64px;font-size:1.05rem;color:var(--soft);
}
.pager button{
  font-family:inherit;font-size:1.05rem;color:var(--soft);
  background:none;border:0;cursor:pointer;padding:4px 2px;
}
.pager button:hover:not(:disabled){color:var(--ink);text-decoration:underline}
.pager button:disabled{opacity:.3;cursor:default}
.pager .count{min-width:110px;text-align:center}
.pager[hidden]{display:none}

/* ── CONTACT ────────────────────────────────── */
.contact{text-align:center}
.contact p{margin-bottom:10px}
.contact a{color:var(--ink);text-decoration:none}
.contact a:hover{text-decoration:underline}

footer{text-align:center;padding:0 0 90px;font-size:1rem;color:var(--soft)}

@media(max-width:640px){
  .wrap{padding:0 26px}
  .card{padding:40px 0 100px}
  .corners{flex-direction:column;gap:20px;text-align:center}
  .corners div:last-child{text-align:center}
  .centerpiece{padding-top:80px}
  .address{margin-top:90px}
  nav a{display:inline-block;margin:6px 14px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="card">
    <div class="corners">
      <div>
        <div class="lg"><a href="mailto:hello@mendozavideo.com">hello@mendozavideo.com</a></div>
        <div class="sm">Yakima Valley &middot; Seattle</div>
      </div>
      <div>
        <div class="lg">Mendoza Video</div>
        <div class="sm">Cinematography &amp; Color</div>
      </div>
    </div>

    <div class="centerpiece">
      <h1>Mendoza <span class="caps">Video</span></h1>
      <div class="title">Director &amp; Colorist</div>
    </div>

    <div class="address">Yakima Valley &middot; Seattle, Washington</div>
  </header>

  <nav>
    <a href="#journal">Journal</a>
    <a href="#work">Work</a>
    <a href="#contact">Contact</a>
  </nav>

  <section id="journal">
    <h2>Journal</h2>
    <div id="entries"></div>
    <div class="pager" id="journal-pager" hidden>
      <button type="button" data-dir="-1">Previous</button>
      <span class="count"></span>
      <button type="button" data-dir="1">Next</button>
    </div>
  </section>

  <section id="work">
    <h2>Selected Work</h2>
    <div id="pieces"></div>
    <div class="pager" id="work-pager" hidden>
      <button type="button" data-dir="-1">Previous</button>
      <span class="count"></span>
      <button type="button" data-dir="1">Next</button>
    </div>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <div class="contact">
      <p><a href="mailto:hello@mendozavideo.com">hello@mendozavideo.com</a></p>
      <p>Seattle, Washington</p>
    </div>
  </section>

  <footer>Mendoza Video</footer>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   HOW MANY PER PAGE — change these two numbers if you want.
   ═══════════════════════════════════════════════════════════ */
const PER_PAGE_JOURNAL = 4;
const PER_PAGE_WORK    = 3;

/* ═══════════════════════════════════════════════════════════
   JOURNAL — copy a block, put it at the TOP of the list.
   body: one string per paragraph.
   ═══════════════════════════════════════════════════════════ */
const POSTS = [
  {
    date: "July 2026",
    title: "The Sigma fp rig, finally settled",
    dek: "Cage, monitor, SSD mount. What stayed and what got cut.",
    body: [
      "Write the post here. Every string in this list becomes its own paragraph.",
      "The rig carried over from the ZV-E10 more cleanly than expected — the cheeseplate hardware all transferred, which is most of why the fp won out."
    ]
  },
  {
    date: "June 2026",
    title: "Godox SL60W, one year in",
    dek: "Cheap, loud, and still the light I reach for first.",
    body: [
      "Replace this with the actual review.",
      "Add as many paragraphs as you want by adding more strings."
    ]
  }
];

/* ═══════════════════════════════════════════════════════════
   WORK — youtube: the ID only, not the whole URL.
     https://youtu.be/dQw4w9WgXcQ  ->  youtube: "dQw4w9WgXcQ"
   Leave youtube as "" for a piece with no video.
   ═══════════════════════════════════════════════════════════ */
const WORK = [
  {
    title: "Hamlet, Reworked",
    dek: "Corporate whistleblower short. Built a full prop kit — Zoom UI, iMessage threads, browser tabs — so every screen on camera was real.",
    youtube: ""
  },
  {
    title: "Mindful Campus Initiative",
    dek: "Short film and companion playlist. Quiet, handheld, natural light.",
    youtube: ""
  },
  {
    title: "Seattle Grade Test",
    dek: "Color grading test shoot with a cinematic title card. Cinema Gamut into S–Log3, Dehancer on the back end.",
    youtube: ""
  }
];

/* ── renderer ─────────────────────────────────────────────── */
function paginate(opts) {
  const host   = document.getElementById(opts.hostId);
  const pager  = document.getElementById(opts.pagerId);
  const count  = pager.querySelector('.count');
  const btns   = pager.querySelectorAll('button');
  const items  = opts.items;
  const per    = opts.perPage;
  const pages  = Math.max(1, Math.ceil(items.length / per));
  let page = 0;

  function draw() {
    host.innerHTML = '';
    if (!items.length) {
      host.innerHTML = '<p style="text-align:center;color:var(--soft)">' + opts.empty + '</p>';
    } else {
      items.slice(page * per, page * per + per).forEach(function (item) {
        host.appendChild(opts.build(item));
      });
    }
    pager.hidden = pages < 2;
    count.textContent = 'Page ' + (page + 1) + ' of ' + pages;
    btns[0].disabled = page === 0;
    btns[1].disabled = page >= pages - 1;
  }

  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      page += Number(b.dataset.dir);
      page = Math.max(0, Math.min(pages - 1, page));
      draw();
      host.closest('section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  draw();
}

function makeToggle(el) {
  const toggle = function () {
    el.classList.toggle('open');
    el.setAttribute('aria-expanded', el.classList.contains('open'));
  };
  el.addEventListener('click', function (e) {
    if (e.target.closest('iframe')) return;
    toggle();
  });
  el.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });
}

paginate({
  hostId: 'entries', pagerId: 'journal-pager',
  items: POSTS, perPage: PER_PAGE_JOURNAL,
  empty: 'No entries yet.',
  build: function (p) {
    const el = document.createElement('article');
    el.className = 'entry';
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-expanded', 'false');
    el.innerHTML =
      '<div class="entry-date">' + p.date + '</div>' +
      '<h3 class="entry-title">' + p.title + '</h3>' +
      '<p class="entry-dek">' + p.dek + '</p>' +
      '<div class="entry-body">' + p.body.map(function (t) { return '<p>' + t + '</p>'; }).join('') + '</div>';
    makeToggle(el);
    return el;
  }
});

paginate({
  hostId: 'pieces', pagerId: 'work-pager',
  items: WORK, perPage: PER_PAGE_WORK,
  empty: 'No work listed yet.',
  build: function (w) {
    const el = document.createElement('article');
    el.className = 'piece';
    let html =
      '<h3>' + w.title + '</h3>' +
      '<p>' + w.dek + '</p>';
    if (w.youtube) {
      el.tabIndex = 0;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-expanded', 'false');
      html += '<p class="watch">Watch</p>' +
        '<div class="player"><div class="frame">' +
        '<iframe src="https://www.youtube-nocookie.com/embed/' + w.youtube +
        '" title="' + w.title + '" loading="lazy" allowfullscreen ' +
        'allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>' +
        '</div></div>';
    } else {
      el.style.cursor = 'default';
    }
    el.innerHTML = html;
    if (w.youtube) makeToggle(el);
    return el;
  }
});
</script>
</body>
</html>
